project:
  type: website
  output-dir: _site
  pre-render: python3 scripts/progress.py      # 공부 진행 현황(books/progress.json) 생성
  render:
    - "*.qmd"
    - "books/**/*.qmd"
    - "strategies/**/*.qmd"
    - "strategies/notebooks/*.ipynb"
    - "journal/*.qmd"
    - "hypotheses/*.qmd"
    - "tools/*.qmd"
    - "!sources/"
    - "!private/"
    - "!README.md"
    - "!DEPLOY.md"
  resources:
    - "data/trades.csv"
    - "data/allocation.csv"
    - "data/returns.csv"
    - "books/progress.json"
    - "js/*.js"

lang: ko

website:
  title: "Quant & Current"
  description: "투자 공부 노트: 책, 전략, 투자일지"
  site-url: https://daeha-invest.github.io
  favicon: images/favicon.png
  search:
    location: navbar
    type: overlay
  page-navigation: true
  back-to-top-navigation: true
  navbar:
    logo: images/logo-mark-light.svg
    logo-alt: "Quant & Current 로고"
    left:
      - text: 공부
        menu:
          - href: books/index.qmd
            text: 책 노트
            icon: book
          - href: books/damodaran-iv/index.qmd
            text: "다모다란 Investment Valuation"
          - href: books/glossary.qmd
            text: 용어집
            icon: journal-text
      - text: 전략
        menu:
          - href: strategies/index.qmd
            text: 전략 한눈에 보기
            icon: diagram-3
          - text: "---"
          - href: strategies/kr-smallcap-value-momentum.qmd
            text: 한국 소형주 가치+모멘텀
          - href: strategies/us-psr.qmd
            text: 미국 PSR
          - href: strategies/haa-etf.qmd
            text: HAA ETF 동적배분
          - text: "---"
          - href: strategies/notebooks/portfolio-kr-us-stocks.ipynb
            text: 스크리너 노트북
      - text: 기록
        menu:
          - href: journal/index.qmd
            text: 투자일지
            icon: pencil-square
          - href: hypotheses/index.qmd
            text: 투자 가설
            icon: lightbulb
      - text: 도구
        menu:
          - href: tools/index.qmd
            text: 도구 한눈에 보기
            icon: tools
          - text: "---"
          - href: tools/rebalance.qmd
            text: 리밸런싱 계산기
          - href: tools/dcf.qmd
            text: DCF·고든 성장 계산기
          - href: tools/wacc.qmd
            text: WACC 계산기
          - href: tools/compound.qmd
            text: 복리·목표 수익률
          - text: "---"
          - href: tools/calendar.qmd
            text: 운용 캘린더
            icon: calendar3
      - href: dashboard.qmd
        text: 대시보드
  page-footer:
    left: "**Quant & Current** · 개인 투자 공부 기록"
    center: "[공부](/books/index.qmd) · [용어집](/books/glossary.qmd) · [전략](/strategies/index.qmd) · [일지](/journal/index.qmd) · [가설](/hypotheses/index.qmd) · [도구](/tools/index.qmd) · [대시보드](/dashboard.qmd)"
    right: "투자 권유가 아니며, 투자 금액은 기록하지 않습니다."

format:
  html:
    theme:
      light: [flatly, styles/custom.scss]
      dark: [darkly, styles/custom.scss, styles/dark.scss]
    toc: true
    toc-title: "목차"
    number-sections: false
    html-math-method: mathjax
    respect-user-color-scheme: true
    code-fold: true
    code-summary: "코드 보기"
    smooth-scroll: true
    link-external-newwindow: true

execute:
  freeze: auto      # 코드는 로컬에서 한 번만 실행되고, 배포 때는 저장된 결과만 사용
  echo: false
