name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # pre-commit 훅을 건너뛰었더라도 금액이 있으면 여기서 배포가 멈춥니다.
      - name: Check data/ and journal/ for amounts
        run: python3 scripts/check_amounts.py --all

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.11.9

      # 코드는 실행하지 않습니다 (노트북은 저장된 출력만, 차트는 브라우저에서 CSV를 읽음).
      - name: Render
        run: quarto render

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
